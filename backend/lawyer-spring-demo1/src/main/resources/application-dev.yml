# 开发环境差异配置
spring:
  # 数据源配置
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true

  # H2控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console

# Actuator扩展配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,mappings
